<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Griffin Home</title>
<style>
@font-face { font-family: 'Instrument Sans'; src: url(fonts/InstrumentSans.woff2) format('woff2'); font-weight: 400 700; }
@font-face { font-family: 'Instrument Serif'; src: url(fonts/InstrumentSerif.woff2) format('woff2'); }

:root {
  --ground: #0B0B0C;
  --tile: #18181B;
  --row: #141416;
  --ink: #F2F0EA;
  --ink-2: #D6D4CE;
  --muted: #A6A49E;
  --faint: #8C8A85;
  --accent: #F2F0EA;
  --glass: rgba(20, 20, 22, .82);
  --serif: 'Instrument Serif', Georgia, serif;
  --mono: ui-monospace, 'Droid Sans Mono', monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
body { font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

/* Designed at 1600x900, scaled to whatever the TV reports. */
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: flex; }

/* ---- Home ---- */
#home { flex-direction: column; overflow: hidden; }

/* Top shelf: a film still behind the hero, like tvOS's full-bleed top shelf. */
.backdrop { position: absolute; inset: 0; transition: opacity 600ms ease; }
.bd { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 1600ms ease; }
.bd.on { opacity: 1; }
.scrim { position: absolute; inset: 0;
  background:
    linear-gradient(to top, var(--ground) 0%, rgba(11,11,12,.94) 46%, rgba(11,11,12,.45) 72%, rgba(11,11,12,.6) 100%),
    linear-gradient(to right, rgba(11,11,12,.8) 0%, rgba(11,11,12,0) 62%); }
#home.down .backdrop { opacity: .35; }

.top { position: absolute; left: 72px; right: 72px; top: 50px; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start; }
.greet { font-family: var(--serif); font-size: 40px; line-height: 1.1; }
.glance { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.clock { display: flex; gap: 20px; align-items: center; font-size: 18px; color: var(--muted); }
.clock b { color: var(--ink); font-size: 22px; font-weight: 500; }
.wx { color: var(--ink-2); }
.wx:empty, .credit:empty { display: none; }
.wx i { font-style: normal; color: var(--faint); margin-left: 8px; }
.credit { font-size: 14px; color: var(--faint); font-family: var(--mono); }

.scroll { position: absolute; left: 0; right: 0; top: 0; transition: transform 320ms var(--ease); }
.hero { height: 410px; box-sizing: border-box; padding: 0 72px 22px; display: flex; align-items: flex-end; justify-content: space-between; transition: opacity 320ms ease; }
#home.down .hero { opacity: 0; }
.kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; font-size: 16px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.hero > div:first-child { flex: 1; min-width: 0; }
.hero h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 120px; line-height: 1.05; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caption { margin-top: 16px; font-size: 18px; color: var(--faint); font-family: var(--mono); }
.caption em { margin-left: 12px; font-style: normal; color: var(--muted); font-family: 'Instrument Sans', system-ui, sans-serif; }

.forecast { display: flex; gap: 12px; margin-bottom: 6px; }
.forecast:empty { display: none; }
.fday { width: 104px; padding: 14px 16px; border-radius: 14px; background: rgba(24,24,27,.6); display: flex; flex-direction: column; gap: 6px; }
.fday b { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.fday span { font-size: 24px; font-weight: 500; }
.fday span i { font-style: normal; color: var(--faint); font-size: 18px; margin-left: 6px; }
.fday small { font-size: 14px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.shelf { padding-top: 6px; }
.label { padding: 0 72px; font-size: 15px; color: var(--faint); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 18px; }
.track { display: flex; gap: 30px; padding: 0 72px; transition: transform 280ms var(--ease); }
.shelf + .shelf { margin-top: 4px; }

.cell { flex: none; width: 232px; }
.tile {
  position: relative; box-sizing: border-box; width: 232px; height: 130px; border-radius: 12px; overflow: hidden;
  background: var(--tile); color: var(--ink-2); box-shadow: 0 6px 14px rgba(0,0,0,.35);
  transition: transform 220ms var(--ease), box-shadow 220ms var(--ease), background 160ms ease, color 160ms ease;
}
.tile img { display: block; }
.tile .banner { width: 100%; height: 100%; object-fit: cover; }
.tile.icon { background: radial-gradient(120% 120% at 50% 0%, var(--c) -60%, #18181B 70%); }
.tile .glyph { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; }
.tile .plain { position: absolute; inset: 0; padding: 18px 18px 16px; display: flex; flex-direction: column; justify-content: space-between; font-size: 19px; font-weight: 500; }
.tile .plain .dot { width: 10px; height: 10px; }
.tile.sys .plain { justify-content: flex-end; }
/* Light sweeping across the focused tile: the d-pad stand-in for tvOS's parallax glint. */
.tile::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(110deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.2) 50%, rgba(255,255,255,0) 65%);
  transform: translateX(-100%); }
.tname { margin-top: 20px; height: 24px; text-align: center; font-size: 18px; font-weight: 500; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 160ms ease; }

.cell.focus .tile { transform: translateY(-4px) scale(1.1); box-shadow: 0 24px 40px rgba(0,0,0,.6); }
.cell.focus .tile::after { animation: sheen 900ms ease-out 80ms 1 both; }
.cell.focus .tname { opacity: 1; }
.cell.focus .tile.plainbg { background: var(--accent); color: var(--ground); }
@keyframes sheen { 0% { opacity: 1; transform: translateX(-100%); } 100% { opacity: 1; transform: translateX(100%); } }

/* Rearranging favorites: the tile wobbles like tvOS's jiggle mode. */
.cell.moving .tile { animation: jiggle 260ms ease-in-out infinite alternate; box-shadow: 0 24px 40px rgba(0,0,0,.6); }
.cell.moving .tile::after { animation: none; }
@keyframes jiggle { from { transform: translateY(-4px) scale(1.1) rotate(-1.4deg); } to { transform: translateY(-4px) scale(1.1) rotate(1.4deg); } }

/* Options for the focused app (hold OK or ☰). */
.sheet { position: absolute; inset: 0; z-index: 5; display: none; justify-content: flex-end; background: rgba(0,0,0,.35); }
.sheet.on { display: flex; }
.panel { width: 560px; height: 100%; box-sizing: border-box; padding: 72px 64px; display: flex; flex-direction: column; justify-content: center;
  background: var(--glass); -webkit-backdrop-filter: blur(40px) saturate(1.4); backdrop-filter: blur(40px) saturate(1.4);
  border-left: 1px solid rgba(255,255,255,.06); animation: slide 240ms var(--ease); }
@keyframes slide { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel .art { width: 232px; height: 130px; margin-bottom: 28px; }
.panel .eyebrow { font-size: 15px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
.panel h3 { margin: 0 0 32px; font-family: var(--serif); font-weight: 400; font-size: 64px; line-height: 1; }
.panel .hint { margin-top: 24px; font-size: 16px; color: var(--faint); }

/* ---- Settings ---- */
.side { width: 560px; flex: none; padding: 72px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; border-right: 1px solid #1E1E21; }
.side .eyebrow { font-size: 16px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
.side h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 104px; line-height: 1; }
.side p { margin: 20px 0 0; font-size: 18px; color: var(--faint); line-height: 1.5; }
.toast { margin-top: 18px; font-size: 16px; color: var(--ink-2); min-height: 22px; }
.list { flex-grow: 1; position: relative; overflow: hidden; }
.list .items { position: absolute; left: 72px; right: 72px; top: 0; display: flex; flex-direction: column; gap: 14px; transition: transform 280ms var(--ease); }
.list .sec { margin: 22px 0 2px; font-size: 15px; color: var(--faint); letter-spacing: .12em; text-transform: uppercase; }
.list .sec:first-child { margin-top: 0; }
.srow {
  display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; border-radius: 14px;
  background: var(--row); color: var(--ink-2); transition: background 110ms ease, color 110ms ease, transform 160ms var(--ease);
}
.panel .srow { background: rgba(255,255,255,.06); margin-bottom: 12px; padding: 20px 26px; }
.srow .t { display: flex; flex-direction: column; gap: 6px; }
.srow .l { font-size: 26px; font-weight: 500; }
.srow .s { font-size: 16px; color: var(--faint); }
.srow .s:empty { display: none; }
.srow .v { font-size: 22px; font-weight: 500; }
.srow.focus, .panel .srow.focus { background: var(--accent); color: var(--ground); transform: scale(1.02); }
.srow.focus .s { color: #3A3936; }

/* ---- Launching ---- */
#launching { flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #050506; }
#launching .dot { width: 16px; height: 16px; }
#launching h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 120px; line-height: 1; }
#launching p { margin: 0; font-size: 18px; color: var(--faint); }
</style>
</head>
<body>
<div id="stage">
  <section id="home" class="screen on">
    <div class="backdrop"><div class="bd" id="bdA"></div><div class="bd" id="bdB"></div><div class="scrim"></div></div>
    <div class="top">
      <span class="greet" id="greet"></span>
      <div class="glance">
        <span class="clock"><span class="wx" id="wx"></span><span id="date"></span><b id="time"></b></span>
        <span class="credit" id="credit"></span>
      </div>
    </div>
    <div class="scroll" id="scroll">
      <div class="hero">
        <div>
          <div class="kicker"><span class="dot" id="heroDot"></span><span id="heroKicker"></span></div>
          <h1 id="heroTitle"></h1>
          <div class="caption" id="heroCaption"></div>
        </div>
        <div class="forecast" id="forecast"></div>
      </div>
      <div id="shelves"></div>
    </div>
    <div class="sheet" id="sheet">
      <div class="panel">
        <div class="art" id="sheetArt"></div>
        <div class="eyebrow" id="sheetKicker"></div>
        <h3 id="sheetTitle"></h3>
        <div id="sheetList"></div>
        <div class="hint">Back to close</div>
      </div>
    </div>
  </section>

  <section id="settings" class="screen">
    <div class="side">
      <div class="eyebrow">Your TV</div>
      <h2>Settings</h2>
      <p>Fire OS 7.7.1.7 · TCL 55S450F<br>Everything here is reversible.</p>
      <div class="toast" id="toast"></div>
    </div>
    <div class="list"><div class="items" id="settingsList"></div></div>
  </section>

  <section id="launching" class="screen">
    <span class="dot" id="launchDot"></span>
    <h1 id="launchName"></h1>
    <p>Back returns home</p>
  </section>
</div>

<script src="weather.js"></script>
<script>
(function () {
  var A = window.Android || null;

  // Known apps: their brand color, and the order Favorites starts in before you change it.
  var KNOWN = [
    { name: 'Netflix', pkg: 'com.netflix.ninja', color: '#E50914' },
    { name: 'YouTube', pkg: 'com.amazon.firetv.youtube', color: '#FF3B30' },
    { name: 'Apple TV', pkg: 'com.apple.atve.amazon.appletv', color: '#C7C7CC' },
    { name: 'Peacock', pkg: 'com.peacock.peacockfiretv', color: '#F5B700' },
    { name: 'Max', pkg: 'com.hbo.hbonow', color: '#3D5AFE' },
    { name: 'Tubi', pkg: 'com.tubitv.ott', color: '#FF6A1A' },
    { name: 'Pluto TV', pkg: 'tv.pluto.android', color: '#FFE14D' },
    { name: 'Fawesome', pkg: 'com.future.moviesByFawesomeAndroidTV', color: '#2EC4B6' },
    { name: 'Crossy Road', pkg: 'com.hipsterwhale.crossy', color: '#7BD389' }
  ];
  var PALETTE = ['#E8A44A', '#7BD389', '#5B7CFA', '#FF6A1A', '#2EC4B6', '#C7C7CC', '#F5B700', '#E85D75'];

  var SYS = [
    { name: 'Screensaver', caption: 'Gargantua, aerials and film stills, right now', run: function () { A && A.startScreensaver(); } },
    { name: 'Settings', caption: 'Animation speed, home guard, screensaver, hidden apps', run: function () { show('settings'); } },
    { name: 'TV settings', caption: 'Fire OS settings: network, display, inputs', run: function () { A && A.tvSettings(); } },
    { name: 'Amazon home', caption: 'Amazon’s home for 10 minutes: inputs, app library', run: function () { A && A.amazonHome(); } }
  ];

  function $(id) { return document.getElementById(id); }
  function load(key, fallback) { try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function json(s, fallback) { try { return JSON.parse(s) || fallback; } catch (e) { return fallback; } }

  // ---- Apps, favorites, hidden ----
  var apps = [], byPkg = {};
  function loadApps() {
    var list = A ? json(A.apps(), []) : KNOWN.map(function (k) { return { pkg: k.pkg, name: k.name }; });
    var known = {};
    KNOWN.forEach(function (k) { known[k.pkg] = k; });
    apps = list.map(function (a, i) {
      var k = known[a.pkg], h = 0;
      for (var j = 0; j < a.pkg.length; j++) h = (h * 31 + a.pkg.charCodeAt(j)) | 0;
      return { pkg: a.pkg, name: k ? k.name : a.name, color: k ? k.color : PALETTE[Math.abs(h) % PALETTE.length] };
    });
    byPkg = {};
    apps.forEach(function (a) { byPkg[a.pkg] = a; });
  }

  var favs = load('home.favorites', null);
  var hidden = load('home.hidden', []);
  function initFavs() {
    if (favs) return;
    favs = KNOWN.filter(function (k) { return byPkg[k.pkg]; }).map(function (k) { return k.pkg; });
    save('home.favorites', favs);
  }
  function isFav(pkg) { return favs.indexOf(pkg) >= 0; }

  // App art: TV banner, else icon, else a plain tile. Rendered to files by MainActivity once per app version.
  var art = {};
  function artFor(pkg) {
    if (!(pkg in art)) art[pkg] = A ? json(A.icon(pkg), false) : false;
    return art[pkg];
  }

  // ---- State ----
  var st = { screen: 'home', r: 0, col: {}, srow: 0, seed: Math.random(), sheet: null, opt: 0, moving: false };
  var shelves = [];   // [{id, label, kind, items, el, track, cells, off}]

  // clientWidth, not innerWidth: the WebView widens innerWidth to fit the unscaled 1600px stage.
  function fit() {
    var w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
    var s = Math.min(w / 1600, h / 900);
    var stage = $('stage');
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = ((w - 1600 * s) / 2) + 'px';
    stage.style.top = ((h - 900 * s) / 2) + 'px';
  }

  function greeting(now) {
    var hr = now.getHours();
    var part = hr < 5 ? 'night' : hr < 12 ? 'morning' : hr < 17 ? 'afternoon' : hr < 22 ? 'evening' : 'night';
    var day = now.toLocaleDateString([], { weekday: 'long' });
    var any = ['Welcome back, Griffin', 'Hey, Griffin', 'Good to see you, Griffin', 'Griffin returns',
      'Happy ' + day + ', Griffin', 'Make yourself at home, Griffin', 'Pick something good, Griffin'];
    var byPart = {
      morning: ['Good morning, Griffin', 'Morning, Griffin', 'Rise and shine, Griffin', 'Coffee and a show, Griffin?', 'Easy start today, Griffin?', 'Slow morning, Griffin?'],
      afternoon: ['Good afternoon, Griffin', 'Afternoon, Griffin', 'Back at it, Griffin', 'Taking a break, Griffin?', 'Midday reset, Griffin?', 'How’s the day going, Griffin?'],
      evening: ['Good evening, Griffin', 'Evening, Griffin', 'What are we watching, Griffin?', 'How was your day, Griffin?', 'Time to unwind, Griffin', 'Settle in, Griffin', 'Lights down, Griffin'],
      night: ['Up late, Griffin?', 'Hey there, night owl', 'One more episode, Griffin?', 'Can’t sleep, Griffin?', 'Burning the midnight oil, Griffin?', 'Late show, Griffin?']
    }[part];
    var weekend = (day === 'Saturday' || day === 'Sunday') ? ['Weekend mode, Griffin', 'Lazy ' + day + ', Griffin?'] : [];
    var all = byPart.concat(any, weekend);
    return all[Math.floor(st.seed * all.length)];
  }

  function tick() {
    var now = new Date();
    $('time').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    $('greet').textContent = greeting(now);
  }

  function showWeather() {
    weather.get(function (w) {
      $('wx').innerHTML = w.temp + '° ' + w.text + '<i>H ' + w.hi + '° L ' + w.lo + '° · Chicago</i>';
      var f = $('forecast');
      f.innerHTML = '';
      (w.days || []).forEach(function (d) {
        var el = document.createElement('div');
        el.className = 'fday';
        el.innerHTML = '<b></b><span></span><small></small>';
        el.querySelector('b').textContent = d.dow;
        el.querySelector('span').innerHTML = d.hi + '°<i>' + d.lo + '°</i>';
        el.querySelector('small').textContent = d.text;
        f.appendChild(el);
      });
    });
  }

  // ---- Backdrop: film stills pushed by scripts/stills.sh, crossfading every 45s ----
  var BACKDROP_MS = 45 * 1000;
  var stills = [], stillAt = -1, bdFront = 0;
  function nextBackdrop() {
    if (!stills.length) stills = json(window.Stills ? Stills.list() : '[]', []);
    if (!stills.length) return;
    stillAt = (stillAt < 0 ? Math.floor(Math.random() * stills.length) : stillAt + 1) % stills.length;
    var s = stills[stillAt], img = new Image();
    img.onload = function () {
      var layers = [$('bdA'), $('bdB')], on = layers[bdFront ^= 1], off = layers[bdFront ^ 1];
      on.style.backgroundImage = 'url("' + s.src + '")';
      on.classList.add('on');
      off.classList.remove('on');
      $('credit').textContent = s.title || '';
    };
    img.src = s.src;
  }

  // ---- Home shelves ----
  function buildShelves() {
    var favApps = favs.map(function (p) { return byPkg[p]; }).filter(Boolean);
    var more = apps.filter(function (a) { return !isFav(a.pkg) && hidden.indexOf(a.pkg) < 0; });
    var prevId = shelves[st.r] ? shelves[st.r].id : null;
    shelves = [];
    if (favApps.length) shelves.push({ id: 'fav', label: 'Favorites', kind: 'Favorite', items: favApps });
    if (more.length) shelves.push({ id: 'more', label: favApps.length ? 'All apps' : 'Apps', kind: 'App', items: more });
    shelves.push({ id: 'sys', label: 'System', kind: 'System', items: SYS });

    var root = $('shelves');
    root.innerHTML = '';
    shelves.forEach(function (sh, r) {
      if (sh.id === prevId) st.r = r;
      sh.el = document.createElement('div');
      sh.el.className = 'shelf';
      sh.el.innerHTML = '<div class="label"></div><div class="track"></div>';
      sh.el.firstChild.textContent = sh.label;
      sh.track = sh.el.lastChild;
      sh.off = 0;
      sh.cells = sh.items.map(function (it) { var c = cell(it, sh.id === 'sys'); sh.track.appendChild(c); return c; });
      root.appendChild(sh.el);
    });
    st.r = Math.min(st.r, shelves.length - 1);
    if (!prevId || shelves[st.r].id !== prevId) st.r = 0;
    shelves.forEach(function (sh) { st.col[sh.id] = Math.min(st.col[sh.id] || 0, sh.items.length - 1); });
    loadArt();
  }

  function cell(it, sys) {
    var c = document.createElement('div');
    c.className = 'cell';
    var t = document.createElement('div');
    t.className = 'tile' + (sys ? ' sys' : '');
    t.style.setProperty('--c', it.color || '#8C8A85');
    c.appendChild(t);
    var n = document.createElement('div');
    n.className = 'tname';
    c.appendChild(n);
    paint(c, it, sys);
    return c;
  }

  function paint(c, it, sys) {
    var t = c.firstChild, n = c.lastChild, a = !sys && art[it.pkg];
    t.innerHTML = '';
    t.classList.remove('icon', 'plainbg');
    if (a && a.banner) {
      var img = document.createElement('img');
      img.className = 'banner';
      img.src = a.src;
      t.appendChild(img);
      n.textContent = it.name;
    } else if (a) {
      t.classList.add('icon');
      var g = document.createElement('img');
      g.className = 'glyph';
      g.src = a.src;
      t.appendChild(g);
      n.textContent = it.name;
    } else {
      t.classList.add('plainbg');
      var p = document.createElement('div');
      p.className = 'plain';
      if (!sys) { var d = document.createElement('span'); d.className = 'dot'; d.style.background = it.color; p.appendChild(d); }
      var s = document.createElement('span');
      s.textContent = it.name;
      p.appendChild(s);
      t.appendChild(p);
      n.textContent = '';
    }
  }

  // Art loads a few tiles at a time after the shelves are up, so the first paint isn't held up.
  var artQueue = [];
  function loadArt() {
    artQueue = [];
    shelves.forEach(function (sh) {
      if (sh.id === 'sys') return;
      sh.items.forEach(function (it, i) {
        if (it.pkg in art) { if (art[it.pkg]) paint(sh.cells[i], it, false); }
        else artQueue.push({ c: sh.cells[i], it: it });
      });
    });
    if (A) setTimeout(artStep, 50);
  }
  function artStep() {
    for (var n = 0; n < 4 && artQueue.length; n++) {
      var q = artQueue.shift();
      if (artFor(q.it.pkg)) paint(q.c, q.it, false);
    }
    if (artQueue.length) setTimeout(artStep, 16);
  }

  function focused() {
    var sh = shelves[st.r];
    return { shelf: sh, it: sh.items[st.col[sh.id]], i: st.col[sh.id] };
  }

  function renderHome() {
    var f = focused();
    shelves.forEach(function (sh, r) {
      sh.cells.forEach(function (c, i) {
        var on = r === st.r && i === st.col[sh.id];
        c.classList.toggle('focus', on);
        c.classList.toggle('moving', on && st.moving);
      });
    });

    // Keep the focused tile inside the safe area, sliding its shelf sideways like tvOS.
    var W = 1600 - 72 * 2, cellEl = f.shelf.cells[f.i];
    var x = cellEl.offsetLeft - 72, w = cellEl.offsetWidth;
    if (x - f.shelf.off < 0) f.shelf.off = x;
    if (x + w - f.shelf.off > W) f.shelf.off = x + w - W;
    f.shelf.track.style.transform = 'translateX(' + (-f.shelf.off) + 'px)';

    // And the focused shelf inside the screen, sliding the hero away when it has to.
    var el = f.shelf.el, y = Math.max(0, el.offsetTop + el.offsetHeight - (900 - 28));
    if (el.offsetTop - y < 140) y = el.offsetTop - 140;
    y = Math.max(0, y);
    $('scroll').style.transform = 'translateY(' + (-y) + 'px)';
    $('home').classList.toggle('down', y > 0);

    var it = f.it, sys = f.shelf.id === 'sys';
    $('heroTitle').textContent = it.name;
    $('heroKicker').textContent = st.moving ? 'Moving' : f.shelf.kind;
    $('heroDot').style.background = sys ? '#8C8A85' : it.color;
    $('heroCaption').innerHTML = '';
    if (st.moving) {
      $('heroCaption').innerHTML = '<em style="margin:0">◂ ▸ to move · OK when it’s in place</em>';
    } else if (sys) {
      $('heroCaption').textContent = it.caption;
    } else {
      $('heroCaption').textContent = it.pkg;
      var em = document.createElement('em');
      em.textContent = 'Hold OK for options';
      $('heroCaption').appendChild(em);
    }
  }

  // ---- Options sheet ----
  function openSheet() {
    var f = focused(), it = f.it;
    if (f.shelf.id === 'sys') return it.run();
    var opts = [{ label: 'Open', run: function () { closeSheet(); launch(it); } }];
    if (isFav(it.pkg)) {
      opts.push({ label: 'Move', sub: 'Rearrange your favorites', run: function () {
        closeSheet(); st.moving = true; renderHome();
      } });
      opts.push({ label: 'Remove from Favorites', run: function () {
        favs.splice(favs.indexOf(it.pkg), 1); save('home.favorites', favs); closeSheet(); buildShelves(); renderHome();
      } });
    } else {
      opts.push({ label: 'Add to Favorites', sub: 'Pinned to the end of the top row', run: function () {
        favs.push(it.pkg); save('home.favorites', favs); closeSheet();
        st.r = 0; buildShelves(); st.r = 0; st.col.fav = favs.length - 1; renderHome();
      } });
      opts.push({ label: 'Hide', sub: 'Settings → Hidden apps brings it back', run: function () {
        hidden.push(it.pkg); save('home.hidden', hidden); closeSheet(); buildShelves(); renderHome();
      } });
    }
    st.sheet = opts;
    st.opt = 0;
    var artEl = $('sheetArt');
    artEl.innerHTML = '';
    artEl.appendChild(cell(it, false).firstChild);
    $('sheetKicker').textContent = f.shelf.kind;
    $('sheetTitle').textContent = it.name;
    $('sheet').classList.add('on');
    renderSheet();
  }
  function renderSheet() {
    var list = $('sheetList');
    list.innerHTML = '';
    st.sheet.forEach(function (o, i) { list.appendChild(srow(o.label, o.sub, '', i === st.opt)); });
  }
  function closeSheet() { st.sheet = null; $('sheet').classList.remove('on'); }

  function moveFav(d) {
    var i = st.col.fav, j = i + d;
    if (j < 0 || j >= favs.length) return;
    var t = favs[i]; favs[i] = favs[j]; favs[j] = t;
    var track = shelves[st.r].track, cells = shelves[st.r].cells, items = shelves[st.r].items;
    if (d > 0) track.insertBefore(cells[j], cells[i]); else track.insertBefore(cells[i], cells[j]);
    t = cells[i]; cells[i] = cells[j]; cells[j] = t;
    t = items[i]; items[i] = items[j]; items[j] = t;
    st.col.fav = j;
  }
  function stopMoving() { st.moving = false; save('home.favorites', favs); renderHome(); }

  // ---- Settings ----
  function srow(label, sub, value, focus) {
    var d = document.createElement('div');
    d.className = 'srow' + (focus ? ' focus' : '');
    d.innerHTML = '<div class="t"><span class="l"></span><span class="s"></span></div><span class="v"></span>';
    d.querySelector('.l').textContent = label;
    d.querySelector('.s').textContent = sub || '';
    d.querySelector('.v').textContent = value || '';
    return d;
  }

  function count(bridge) { return json(bridge ? bridge.list() : '[]', []).length; }

  function settingsRows() {
    var anim = A ? A.getAnim() : 0.5;
    var guard = A ? A.guardOn() : true;
    var modes = load('saver.modes', {});
    var nAerials = count(window.Aerials), nStills = count(window.Stills);
    function mode(key, label, sub) {
      var on = modes[key] !== false;
      return { label: label, sub: sub, value: on ? 'On' : 'Off', run: function () {
        modes[key] = !on; save('saver.modes', modes);
        toast(label + (on ? ' off' : ' on') + ' in the screensaver');
      } };
    }
    return [
      { section: 'Home', label: 'Home guard', sub: guard ? 'This screen replaces Amazon’s home' : 'Amazon’s home is back', value: guard ? 'On' : 'Off', run: function () {
          var ok = A && A.setGuardOn(!guard);
          toast(ok ? (guard ? 'Off — open Griffin Home from Your Apps to turn it back on' : 'On — Home button now comes here') : 'Not allowed — re-run install.sh');
        } },
      { label: 'Animation speed', sub: 'OK cycles 0.5x → 1.0x → Off', value: anim === 0 ? 'Off' : anim + 'x', run: function () {
          var next = anim === 0.5 ? 1 : anim === 1 ? 0 : 0.5;
          toast(A && A.setAnim(next) ? 'Animation speed set to ' + (next === 0 ? 'off' : next + 'x') : 'Not allowed — re-run install.sh');
        } },
      { label: 'Hidden apps', sub: hidden.length ? 'OK brings them all back' : 'Hold OK on an app to hide it', value: String(hidden.length), run: function () {
          var n = hidden.length;
          hidden = []; save('home.hidden', hidden); buildShelves();
          toast(n ? n + (n === 1 ? ' app' : ' apps') + ' back in All apps' : 'Nothing hidden');
        } },
      { section: 'Screensaver', label: 'Start now', sub: 'It also starts on its own when the TV sits idle', value: '▶', run: function () { A && A.startScreensaver(); } },
      mode('hole', 'Gargantua', 'Interstellar’s black hole, 3 minutes'),
      mode('aerial', 'Apple aerials', nAerials ? nAerials + (nAerials === 1 ? ' 4K clip' : ' 4K clips') + ' on the TV' : 'None on the TV yet — scripts/stills.sh'),
      mode('stills', 'Film stills', nStills ? nStills + (nStills === 1 ? ' still' : ' stills') + ' on the TV · also the home backdrop' : 'None on the TV yet — scripts/stills.sh'),
      { section: 'System', label: 'Ads & tracking', sub: '17 Amazon apps disabled · 3 protected by Fire OS', value: 'Cleaned', run: function () { toast('Managed from the Mac: scripts/debloat.sh'); } },
      { label: 'Restore everything', sub: 'Re-enable apps, stock animations, Amazon home', value: 'Mac', run: function () { toast('Run ./scripts/restore.sh from the fire-tv repo'); } }
    ];
  }

  var rows = [], rowEls = [];
  function renderSettings() {
    rows = settingsRows();
    var list = $('settingsList');
    list.innerHTML = '';
    rowEls = rows.map(function (r, i) {
      if (r.section) {
        var s = document.createElement('div');
        s.className = 'sec';
        s.textContent = r.section;
        list.appendChild(s);
      }
      var d = srow(r.label, r.sub, r.value, st.srow === i);
      list.appendChild(d);
      return d;
    });
    // Scroll so the focused row (and its section label) stays on screen.
    var el = rowEls[st.srow], top = 72, bottom = 900 - 72;
    var y = list._y || 0;
    if (el.offsetTop + el.offsetHeight - y > bottom - top) y = el.offsetTop + el.offsetHeight - (bottom - top);
    if (el.offsetTop - 50 - y < 0) y = Math.max(0, el.offsetTop - 50);
    if (st.srow === 0) y = 0;
    list._y = y;
    list.style.transform = 'translateY(' + (top - y) + 'px)';
  }

  var toastTimer;
  function toast(msg) {
    $('toast').textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').textContent = ''; }, 4000);
    renderSettings();
  }

  function show(name) {
    st.screen = name;
    ['home', 'settings', 'launching'].forEach(function (s) { $(s).classList.toggle('on', s === name); });
    if (name === 'home') renderHome();
    if (name === 'settings') { st.srow = 0; $('toast').textContent = ''; renderSettings(); }
  }

  function launch(app) {
    $('launchName').textContent = app.name;
    $('launchDot').style.background = app.color;
    show('launching');
    setTimeout(function () {
      if (!(A && A.launch(app.pkg))) show('home');
    }, 150);
  }

  function key(k) {
    if (st.screen === 'home') homeKey(k);
    else if (st.screen === 'settings') {
      if (k === 'up') st.srow = Math.max(0, st.srow - 1);
      else if (k === 'down') st.srow = Math.min(rows.length - 1, st.srow + 1);
      else if (k === 'ok' || k === 'hold') return rows[st.srow].run();
      else if (k === 'back' || k === 'menu') return show('home');
      renderSettings();
    } else if (k === 'back') show('home');
  }

  function homeKey(k) {
    if (st.sheet) {
      if (k === 'up') st.opt = Math.max(0, st.opt - 1);
      else if (k === 'down') st.opt = Math.min(st.sheet.length - 1, st.opt + 1);
      else if (k === 'ok') return st.sheet[st.opt].run();
      else if (k === 'back' || k === 'menu') return closeSheet();
      return renderSheet();
    }
    if (st.moving) {
      if (k === 'left' || k === 'right') moveFav(k === 'right' ? 1 : -1);
      else if (k === 'ok' || k === 'back' || k === 'hold') return stopMoving();
      return renderHome();
    }
    var sh = shelves[st.r];
    if (k === 'up' || k === 'down') st.r = Math.max(0, Math.min(shelves.length - 1, st.r + (k === 'down' ? 1 : -1)));
    else if (k === 'left') st.col[sh.id] = Math.max(0, st.col[sh.id] - 1);
    else if (k === 'right') st.col[sh.id] = Math.min(sh.items.length - 1, st.col[sh.id] + 1);
    else if (k === 'ok') { var it = focused().it; return sh.id === 'sys' ? it.run() : launch(it); }
    else if (k === 'hold' || k === 'menu') return openSheet();
    else if (k === 'back') { st.r = 0; st.col[shelves[0].id] = 0; }   // tvOS: Back jumps to the top
    renderHome();
  }

  // Called by MainActivity whenever the user comes back home.
  function resume() {
    st.seed = Math.random();
    closeSheet();
    if (st.moving) { st.moving = false; save('home.favorites', favs); }
    loadApps();
    buildShelves();
    tick();
    showWeather();
    show('home');
  }

  window.tv = { key: key, resume: resume };

  // Browser testing without the Android bridge.
  if (!A) {
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', Escape: 'back', Backspace: 'back', m: 'menu', h: 'hold' };
    document.addEventListener('keydown', function (e) { if (map[e.key]) { e.preventDefault(); key(map[e.key]); } });
  }

  window.addEventListener('resize', fit);
  fit();
  loadApps();
  initFavs();
  buildShelves();
  tick();
  renderHome();
  setInterval(tick, 15000);
  showWeather();
  setInterval(showWeather, 10 * 60 * 1000);
  nextBackdrop();
  setInterval(function () { if (st.screen === 'home') nextBackdrop(); }, BACKDROP_MS);
})();
</script>
</body>
</html>
