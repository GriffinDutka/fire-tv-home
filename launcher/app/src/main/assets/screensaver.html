<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Griffin Home screensaver</title>
<link rel="stylesheet" href="ui.css">
<style>
/* Screensaver: the picture sharp, the date, a frosted-glass clock and three glass cards (docs/redesign/SPEC.md §6).
   The page is transparent so an aerial playing in SaverView's VideoView underneath shows through. */
html, body { background: transparent; }
.wall { transition: opacity 2.5s ease; }
body.video .wall { opacity: 0; }
#garg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 2.5s ease; background: #000; }
#garg.on { opacity: 1; }
.saver { position: absolute; inset: 0; transition: opacity 2.5s ease; }
body.garg .saver { opacity: 0; }
.sv-date { position: absolute; top: 92px; left: 0; right: 0; text-align: center; font: 500 32px/1 var(--sans); text-shadow: 0 2px 18px rgba(0,0,0,.45); }
.sv-time { position: absolute; top: 126px; left: 0; right: 0; height: 270px; font-family: var(--display); font-weight: 700; font-size: 230px; line-height: 1; letter-spacing: -.035em; }
/* Frosted-glass digits: the picture blurred through the numbers, a soft shadow behind, a bright edge on top.
   Each layer is masked to the clock's shape, drawn on a canvas so the glass follows the exact glyphs. */
.sv-time .layer { position: absolute; left: 50%; top: 0; transform: translateX(-50%); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.sv-time .shadow { background: rgba(0,0,0,.16); filter: blur(22px); top: 6px; }
.sv-time .frost { -webkit-backdrop-filter: blur(calc(var(--blur) * .8 + 6px)) saturate(1.8) brightness(1.18); backdrop-filter: blur(calc(var(--blur) * .8 + 6px)) saturate(1.8) brightness(1.18);
  background: linear-gradient(175deg, rgba(255,255,255,calc(var(--tint) + .55)) 0%, rgba(255,255,255,calc(var(--tint) + .26)) 55%, rgba(255,255,255,calc(var(--tint) + .34)) 100%); }
.sv-time .rim { background: rgba(255,255,255,.85); }
.sv-time .plain { position: absolute; inset: 0; text-align: center; color: rgba(255,255,255,.9); }
.sv-row { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; align-items: stretch; gap: 18px; }
.sv-wx { --extra: .3; width: 330px; flex: none; box-sizing: border-box; padding: 20px 24px; border-radius: 28px; display: flex; flex-direction: column; gap: 4px; }
.sv-wx .city { font-size: 15px; font-weight: 700; letter-spacing: .04em; color: rgba(255,255,255,.75); }
.sv-wx .now { font-size: 64px; font-weight: 400; line-height: 1; }
.sv-wx .cond { font-size: 17px; }
.sv-wx .hl { font-size: 15px; color: rgba(255,255,255,.7); }
.sv-wx .days { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); font-size: 15px; }
.sv-wx .days span b { display: block; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.65); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.sv-row .cal { flex: none; }
.sv-news { --extra: .3; flex: 1; min-width: 0; box-sizing: border-box; padding: 20px 26px; border-radius: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.sv-news .src { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.7); display: flex; gap: 10px; align-items: center; }
.sv-news .src i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.sv-news .hl { font-size: 26px; font-weight: 500; line-height: 1.3; transition: opacity 500ms ease; }
.sv-news .more { font-size: 15px; color: rgba(255,255,255,.65); }
</style>
</head>
<body>
<div id="stage">
  <div class="wall"><div class="scene drift" id="scene"><div class="sky"></div><div class="ridge r1"></div><div class="ridge r2"></div><div class="pic"></div><div class="pic"></div></div></div>
  <div class="saver" id="saver">
    <div class="sv-date" id="svDate"></div>
    <div class="sv-time" id="svTime" role="img"></div>
    <div class="sv-row">
      <div class="sv-wx glass dark" id="svWx"></div>
      <div class="cal glass dark" id="svCal" aria-label="Calendar"></div>
      <div class="sv-news glass dark" id="svNews">
        <div class="src"><i id="newsDot"></i><span id="newsSrc"></span></div>
        <div class="hl" id="newsHl"></div>
        <div class="more" id="newsMore"></div>
      </div>
    </div>
  </div>
</div>

<script src="weather.js"></script>
<script src="glass.js"></script>
<script src="prefs.js"></script>
<script src="calendar.js"></script>
<script src="news.js"></script>
<script src="pictures.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var stage = $('stage'), body = document.body;
  var prefs = settings.load();
  look.apply();
  stage.classList.toggle('bigtext', prefs.textSize === 'Large');
  $('svWx').hidden = !prefs.svWeather;
  $('svCal').hidden = !prefs.svCal;
  $('svNews').hidden = !prefs.svNews;

  function fit() {
    var w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
    var s = Math.min(w / 1600, h / 900);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = ((w - 1600 * s) / 2) + 'px';
    stage.style.top = ((h - 900 * s) / 2) + 'px';
  }

  // ---- Pictures, aerials and the Gargantua scene ----
  // The same picture Home blurs (Store currentPicture), changing on Settings → Pictures → Change picture.
  // Aerials play in SaverView's VideoView under this page: Java calls saver.videoStarted() once it's on screen.
  var EVERY = (pictures.EVERY[prefs.picEvery] || 15) * 6e4, FADE_MS = 2500;
  var scene = null, sceneAt = Date.now(), turn = 0;

  function showPic(pic) {
    var was = scene;
    scene = pic ? pic.kind : null;
    if (was === 'gargantua') leaveGargantua();
    if (pic && pic.kind === 'aerial') {
      if (window.Aerials) Aerials.poster(pic.name);   // Home shows a still of it after wake; start making that now
      if (!(window.Aerials && Aerials.play(pic.name))) { scene = null; return; }
    } else {
      if (was === 'aerial') leaveAerial();
      if (pic) pictures.show($('scene'), pic);
    }
  }
  function videoStarted() { if (scene === 'aerial') body.classList.add('video'); }
  function videoEnded() { if (scene === 'aerial') advance(); }
  function leaveAerial() {
    body.classList.remove('video');
    setTimeout(function () { if (scene !== 'aerial' && window.Aerials) Aerials.stop(); }, FADE_MS + 100);
  }

  function showGargantua() {
    if (scene === 'aerial') leaveAerial();
    scene = 'gargantua';
    var f = document.createElement('iframe');
    f.id = 'garg'; f.src = 'gargantua.html#scene';
    document.body.appendChild(f);
    f.onload = function () { if (scene === 'gargantua') { f.classList.add('on'); body.classList.add('garg'); } };
  }
  function leaveGargantua() {
    var f = $('garg');
    body.classList.remove('garg');
    if (!f) return;
    f.id = ''; f.classList.remove('on');
    setTimeout(function () { f.remove(); }, FADE_MS + 100);
  }

  // Gargantua, when it's on, is one more entry in the rotation.
  function advance() {
    var n = pictures.list(prefs).length;
    turn++;
    var garg = prefs.gargantua && scene !== 'gargantua' &&
      (!n || (prefs.picShuffle ? Math.random() < 1 / (n + 1) : turn % (n + 1) === 0));
    if (garg) showGargantua(); else showPic(pictures.next(prefs));
    sceneAt = Date.now();
  }

  function startScene() {
    var pic = pictures.current(prefs);
    if (!pic && prefs.gargantua) return showGargantua();
    showPic(pic);
    sceneAt = pic && pic.at ? pic.at : Date.now();
  }

  // ---- Date and clock ----
  function renderTime(now) {
    $('svDate').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    drawTime(fmt.time(now, prefs.clock24).replace(/\s?[AP]M$/i, ''));
  }

  // Clock as glass: the time rendered into canvas masks (fill + top edge) in the headline font.
  // Redrawn only when the text or font changes, once the font has loaded.
  var shownTime = '', shownFont = '';
  function drawTime(text) {
    var el = $('svTime'), cs = getComputedStyle(el), size = 230;
    var spec = cs.fontWeight + ' ' + size + 'px ' + cs.fontFamily;
    if (text === shownTime && spec === shownFont) return;
    shownTime = text; shownFont = spec;
    var ls = parseFloat(cs.letterSpacing) || 0;
    el.setAttribute('aria-label', text);
    function paint() {
      if (shownTime !== text) return;
      if (prefs.clockStyle === 'Solid' || !glass.supported) {
        el.innerHTML = '<div class="plain"></div>'; el.firstChild.textContent = text; return;
      }
      function mask(edge) {
        var c = document.createElement('canvas'), x = c.getContext('2d');
        x.font = spec; try { x.letterSpacing = ls + 'px'; } catch (e) {}
        var w = Math.ceil(x.measureText(text).width) + 40, h = Math.ceil(size * 1.16);
        c.width = w; c.height = h;
        x.font = spec; try { x.letterSpacing = ls + 'px'; } catch (e) {}
        x.textBaseline = 'alphabetic';
        x.fillStyle = '#fff'; x.fillText(text, 20, size * .94);
        // Top-edge highlight: the glyphs minus themselves shifted down a touch (no outline, so no seams).
        if (edge) { x.globalCompositeOperation = 'destination-out'; x.fillText(text, 21, size * .94 + 3); }
        return { url: 'url(' + c.toDataURL() + ')', w: w, h: h };
      }
      var fill = mask(false), rim = mask(true);
      el.innerHTML = '<div class="layer shadow"></div><div class="layer frost"></div><div class="layer rim"></div>';
      [['shadow', fill], ['frost', fill], ['rim', rim]].forEach(function (p) {
        var d = el.querySelector('.' + p[0]);
        d.style.width = p[1].w + 'px'; d.style.height = p[1].h + 'px';
        d.style.webkitMaskImage = p[1].url; d.style.maskImage = p[1].url;
      });
    }
    if (document.fonts && document.fonts.load) document.fonts.load(spec, text).then(paint, paint); else paint();
  }

  // ---- Weather card ----
  var wx = null;
  function title(s) { return s.replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  // Short words for the 3-day row: Rain, Cloudy, Clear, Snow, Storms, Fog.
  function short(t) {
    return /thunder/.test(t) ? 'Storms' : /snow/.test(t) ? 'Snow' : /rain|drizzle|showers/.test(t) ? 'Rain'
      : /fog/.test(t) ? 'Fog' : /cloud|overcast/.test(t) ? 'Cloudy' : 'Clear';
  }
  function renderWx() {
    var el = $('svWx');
    if (!wx) { el.innerHTML = '<div class="city">CHICAGO</div><div class="cond">Weather is on its way</div>'; return; }
    el.innerHTML = '<div class="city">CHICAGO</div><div class="now"></div><div class="cond"></div><div class="hl"></div><div class="days"></div>';
    el.querySelector('.now').textContent = wx.temp + '°';
    el.querySelector('.cond').textContent = title(wx.text);
    el.querySelector('.hl').textContent = 'H:' + wx.hi + '° L:' + wx.lo + '°';
    (wx.days || []).slice(0, 3).forEach(function (d) {
      var s = document.createElement('span');
      s.innerHTML = '<b></b>';
      s.firstChild.textContent = d.dow;
      s.appendChild(document.createTextNode(d.hi + '° · ' + short(d.text)));
      el.querySelector('.days').appendChild(s);
    });
  }
  function refreshWeather() { weather.get(function (w) { wx = w; renderWx(); }, prefs.units); }

  // ---- Headlines: one at a time, cycling through the enabled topics ----
  var newsStep = 0;
  function renderNews() {
    var n = news.at(newsStep, prefs);
    if (!n) {
      $('newsSrc').textContent = 'Headlines';
      $('newsDot').style.background = '';
      $('newsHl').textContent = 'All topics are off. Turn some on in Settings → News.';
      $('newsMore').textContent = '';
      return;
    }
    $('newsSrc').textContent = n.topic;
    $('newsDot').style.background = n.color;
    $('newsHl').textContent = n.title;
    $('newsMore').textContent = 'Headlines · ' + n.n + ' of ' + n.total;
  }
  var NEWS_MS = { '8 seconds': 8000, '15 seconds': 15000, '30 seconds': 30000 }[prefs.newsEvery] || 8000;
  setInterval(function () {
    var h = $('newsHl');
    h.style.opacity = 0;
    setTimeout(function () { newsStep++; renderNews(); h.style.opacity = 1; }, 500);
  }, NEWS_MS);

  // Everything on screen refreshes every 15s; the picture moves on when its time is up.
  function refresh() {
    var now = new Date();
    renderTime(now);
    calendar.render($('svCal'), now, prefs);
    if (Date.now() - sceneAt >= EVERY) advance();
  }

  window.saver = { videoStarted: videoStarted, videoEnded: videoEnded, next: advance, gargantua: showGargantua, scene: function () { return scene; } };
  document.addEventListener('livedata', function () { calendar.render($('svCal'), new Date(), prefs); renderNews(); });

  window.addEventListener('resize', fit);
  fit();
  startScene();
  refresh();
  renderWx();
  renderNews();
  refreshWeather();
  setInterval(refresh, 15000);
  setInterval(refreshWeather, 10 * 60 * 1000);
})();
</script>
<script src="data.js"></script>
<script src="ical.js"></script>
<script src="feeds.js"></script>
<script src="steam.js"></script>
<script src="live.js"></script>
<script src="livebridge.js"></script>
<script>livebridge.start({ wifi: false });</script>
</body>
</html>
